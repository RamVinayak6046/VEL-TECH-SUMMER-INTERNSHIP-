<!DOCTYPE html>
<html>
<head>
    <title>DOM Manipulation</title>
</head>
<body>

    <h2 id="heading">Welcome</h2>
    <button onclick="changeText()">Change Text</button>

    <script>
        function changeText() {
            document.getElementById("heading").innerText =
                "JavaScript DOM Manipulation";
        }
    </script>

</body>
</html>
